<!doctype html>
<html lang="%%LANG%%">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%TITLE%%</title>
<!-- EXTERNAL -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/font/Serif/cmun-serif.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<!-- /EXTERNAL -->
<style>
/* Layout mirrors NotesTeXV3: text width .62, margin-note width .20, separation .02 of the page;
   section titles with a Maroon rule; theorem-like blocks with a coloured west border and the
   block name hanging in the left margin. */
:root {
  --paper: #ffffff; --ink: #161616; --muted: #555;
  --maroon: #800000;
  --cerulean: #1b9ad6; --cerulean-bg: #e8f5fc;
  --dandelion: #f2a83b; --dandelion-bg: #fef6ea;
  --navy: #3c64b4; --red: #d4302c; --black: #161616;
  --link: #1d4f91; --rule: #161616;
  --pop-bg: #ffffff; --pop-border: #c9c9c9; --pop-shadow: 0 10px 30px rgba(0,0,0,.18);
  --code-bg: #f4f4f2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1b1b1d; --ink: #e8e6e3; --muted: #a8a5a0;
    --maroon: #d27878; --cerulean: #5cb8e6; --cerulean-bg: #1d2a33;
    --dandelion: #e8b25c; --dandelion-bg: #2e281d;
    --navy: #8aa8e6; --red: #ef7470; --black: #d8d6d2;
    --link: #8fb7f0; --rule: #d8d6d2;
    --pop-bg: #242427; --pop-border: #444; --pop-shadow: 0 10px 30px rgba(0,0,0,.5);
    --code-bg: #232326;
  }
}
:root[data-theme="dark"] {
  --paper: #1b1b1d; --ink: #e8e6e3; --muted: #a8a5a0;
  --maroon: #d27878; --cerulean: #5cb8e6; --cerulean-bg: #1d2a33;
  --dandelion: #e8b25c; --dandelion-bg: #2e281d;
  --navy: #8aa8e6; --red: #ef7470; --black: #d8d6d2;
  --link: #8fb7f0; --rule: #d8d6d2;
  --pop-bg: #242427; --pop-border: #444; --pop-shadow: 0 10px 30px rgba(0,0,0,.5);
  --code-bg: #232326;
}
html { background: var(--paper); }
/* code listings (package input/output): pre.code for blocks, code inline */
code { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: .84em; }
pre.code { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: .78em; line-height: 1.45;
  background: var(--code-bg); border-left: 2px solid var(--muted); padding: .7em 1em; margin: 0 0 1em;
  overflow-x: auto; white-space: pre; box-sizing: border-box; }
pre.code code { font-size: inherit; }
pre.code.out { background: transparent; border-left: 2px dashed var(--muted); }
pre.code.out::before { content: "output"; display: block; margin-bottom: .3em; color: var(--muted); font-size: .9em; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: "Computer Modern Serif", "Latin Modern Roman", "CMU Serif", Georgia, serif;
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
.page { max-width: 1240px; margin: 0 auto; padding: 48px 28px 120px 150px; box-sizing: border-box; }
header > *, section > * { width: 64%; box-sizing: border-box; }
/* a display equation written between paragraphs is wrapped in an inline <span>; make it a block so the
   64% column width applies and the equation centres on the text column, not on column + margin */
header > span:has(> .katex-display), section > span:has(> .katex-display) { display: block; }
p { margin: 0 0 .85em; text-align: justify; hyphens: auto; }
a { color: var(--link); text-decoration: none; }
.sc { font-variant: small-caps; }

/* title block */
.titleblock h1 { font-size: 2.1em; line-height: 1.15; margin: 0 0 .2em; font-weight: bold; }
.subtitle { font-size: 1.1em; color: var(--muted); margin-bottom: 1.4em; text-align: left; }
.abstract p { font-size: .9em; }

/* sections */
h2 {
  font-size: 1.45em; font-weight: bold; margin: 2.2em 0 .7em; padding-bottom: .15em;
  border-bottom: .8px solid var(--maroon); line-height: 1.25;
}
h2[data-num]::before {
  content: "Section " attr(data-num); display: block; font-size: .5em; font-weight: normal;
  font-variant: small-caps; letter-spacing: .02em; margin-bottom: .15em;
}

/* theorem-like blocks */
.env { position: relative; margin: 1em 0 1em; padding: .45em .6em .05em; }
.env::before {
  content: attr(data-label); position: absolute; right: calc(100% + 12px); top: .62em;
  font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; font-size: .62em;
  white-space: nowrap; color: var(--ink);
}
.env.def { background: var(--cerulean-bg); border-left: 1.5px solid var(--cerulean); }
.env.thm { background: var(--dandelion-bg); border-left: 1.5px solid var(--dandelion); }
.env.ex  { border-left: 1.5px solid var(--black); }
.env.hw  { background: color-mix(in srgb, var(--maroon) 7%, transparent); border-left: 1.5px solid var(--maroon); }
.env.hw::before { color: var(--maroon); }
.env.rem { padding-left: 0; }
.env.rem::before, .env.ex::before { font-family: inherit; font-weight: normal; font-style: italic; font-size: .78em; }
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.env p:last-child { margin-bottom: .5em; }
/* key sentences: bold, so that the skeleton stands out at every fold level */
k { font: inherit; font-weight: 700; }

/* explainer widget: folded background for readers new to a notation */
details.aside { margin: .2em 0 1.1em; padding: .1em .75em; border-left: 1.5px dotted var(--cerulean); background: color-mix(in srgb, var(--cerulean-bg) 55%, transparent); }
details.aside > summary { cursor: pointer; list-style: none; font-size: .86em; color: var(--cerulean); padding: .25em 0; user-select: none; }
details.aside > summary::-webkit-details-marker { display: none; }
details.aside > summary::before { content: "▸ "; font-size: .8em; }
details.aside[open] > summary::before { content: "▾ "; }
details.aside p, details.aside li { font-size: .93em; }
/* figures drawn for the note (white panel in both themes) */
figure.plot { margin: 1.3em 0 1.2em; }
figure.plot.narrow { width: 46%; }
/* figure in the right margin, beside the text it supports */
figure.plot.margin { float: right; clear: right; width: 31%; margin: .3em 0 1em; }
figure.plot.margin figcaption { font-size: 13px; line-height: 1.38; }
figure.plot img { display: block; width: 100%; height: auto; background: #fff; border-radius: 3px; }
figure.plot > svg { display: block; width: 100%; height: auto; background: #fff; border-radius: 3px; }
figure.plot figcaption { font-size: 14px; margin-top: .5em; text-align: left; line-height: 1.4; }
details.proof { position: relative; margin: -.4em 0 1.1em; padding: .1em .6em; border-left: 1.5px solid var(--navy); }
details.proof > summary {
  cursor: pointer; list-style: none; font-variant: small-caps; font-size: .9em; color: var(--navy);
  padding: .15em 0; user-select: none;
}
details.proof > summary::-webkit-details-marker { display: none; }
details.proof > summary::before { content: "▸ "; font-size: .8em; }
details.proof[open] > summary::before { content: "▾ "; }
details.proof > summary::after { content: " — derivation"; font-variant: normal; font-style: italic; color: var(--muted); font-size: .9em; }
details.proof[open] > summary::after { content: ""; }
details.proof[open] > p:last-child::after { content: " ∎"; }
/* folded homework solutions under an .env.hw block */
details.proof.sol { border-left-color: var(--maroon); }
details.proof.sol > summary { color: var(--maroon); }
details.proof.sol > summary::after { content: ""; }
details.proof ul, details.aside ul { margin: .2em 0 .8em; padding-left: 1.3em; }
.env ul { margin: .2em 0 .6em; padding-left: 1.3em; }

/* tables (booktabs) */
.tablewrap { margin: 1.2em 0; }
table { border-collapse: collapse; width: 100%; font-size: .88em; border-top: 1.4px solid var(--rule); border-bottom: 1.4px solid var(--rule); }
caption { caption-side: top; text-align: left; font-size: 14px; padding-bottom: .4em; }
th { font-weight: normal; text-align: left; padding: .35em .6em; }
tr:first-child th { border-bottom: .7px solid var(--rule); }
td { padding: .3em .6em; vertical-align: top; }

/* margin notes */
.sn-ref { counter-increment: none; font-size: .68em; vertical-align: super; line-height: 0; color: var(--maroon); cursor: default; padding-left: 1px; }
.sn-toggle { display: none; }
.sidenote, .marginnote {
  float: right; clear: right; width: 50%; margin-right: -56%; margin-top: .2em; margin-bottom: .8em;
  font-size: 13px; line-height: 1.38; font-style: italic; text-align: left; position: relative;
}
.marginnote { font-style: normal; }
.sn-num { font-style: normal; color: var(--maroon); font-size: .85em; vertical-align: super; line-height: 0; }
.sidenote .katex, .marginnote .katex { font-size: 1.05em; }

/* citations and preview window */
a.cite { font-size: .8em; white-space: nowrap; border-bottom: 1px dotted currentColor; }
a.cite:hover, a.cite:focus { background: color-mix(in srgb, var(--link) 12%, transparent); outline: none; }
.preview {
  position: fixed; z-index: 50; display: none; width: min(600px, calc(100vw - 24px));
  max-height: min(72vh, 640px); overflow: auto; background: var(--pop-bg); color: var(--ink);
  border: 1px solid var(--pop-border); border-radius: 6px; box-shadow: var(--pop-shadow);
  font-size: 14px; line-height: 1.4;
}
.preview .pv-head { padding: 8px 12px 6px; border-bottom: 1px solid var(--pop-border); font-family: "Helvetica Neue", Arial, sans-serif; font-size: 12.5px; }
.preview .pv-head .pv-loc { float: right; color: var(--muted); }
.preview .pv-where { color: var(--muted); }
.preview .pv-body { padding: 8px 10px; background: #fff; }
.preview .pv-body img { display: block; width: 100%; height: auto; }
.preview .pv-text { background: var(--pop-bg); font-style: italic; padding: 10px 14px; margin: 0; font-size: 15px; }
.preview .pv-foot { padding: 6px 12px 8px; border-top: 1px solid var(--pop-border); font-family: "Helvetica Neue", Arial, sans-serif; font-size: 12px; color: var(--muted); }

/* internal cross-references ("Theorem 3.6", "(4.5)", "Figure 5.1", "§5.3") and their previews */
a.xref { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--link); }
a.xref:hover, a.xref:focus { color: var(--link); background: color-mix(in srgb, var(--link) 10%, transparent); outline: none; }
.preview .pv-ref { padding: 6px 14px 8px; font-size: 15px; line-height: 1.45; }
.preview .pv-ref .env { width: auto; margin: .3em 0; }
.preview .pv-ref .env::before { position: static; display: block; text-align: left; margin-bottom: .2em; width: auto; }
.preview .pv-ref figure, .preview .pv-ref .tablewrap, .preview .pv-ref p, .preview .pv-ref .katex-display { width: auto !important; float: none !important; margin: .4em 0; }
.preview .pv-ref img { max-width: 100%; height: auto; }
.preview .pv-ref h2, .preview .pv-ref h3 { margin: .2em 0 .4em; }
.xref-flash { animation: xrefflash 1.6s ease-out; }
@keyframes xrefflash { 0% { background: color-mix(in srgb, var(--link) 28%, transparent); } 100% { background: transparent; } }

/* sources */
.sources h2 { border-bottom-color: var(--maroon); }
.build-stamp { color: var(--muted); font-size: .85em; margin-top: 3em; }
ol.biblio { font-size: .86em; padding-left: 1.4em; }
ol.biblio li { margin-bottom: .35em; }


/* parts and subsections */
.part { margin: 4.2em 0 1.4em; padding-top: 1.1em; border-top: 2.4px solid var(--maroon); }
.part > * { width: 64%; box-sizing: border-box; }
.part::before {
  content: "Part " attr(data-part); display: block; font-variant: small-caps; letter-spacing: .04em;
  color: var(--maroon); font-size: 1em; margin-bottom: .1em;
}
.part h1 { font-size: 2em; line-height: 1.15; margin: 0 0 .35em; }
.part .partsub { color: var(--muted); font-size: 1em; text-align: left; }
h3 { font-size: 1.12em; font-weight: bold; margin: 1.8em 0 .55em; line-height: 1.3; }
h3[data-num]::before { content: attr(data-num) "\2002"; }

/* side navigation: built from the parts, h2 and h3; parts and sections fold */
:root { --navw: 290px; }
.toc {
  position: fixed; top: 0; bottom: 0; left: 0; width: var(--navw); z-index: 45; box-sizing: border-box;
  overflow-y: auto; padding: 50px 14px 40px 16px; background: var(--paper);
  border-right: 1px solid var(--pop-border); font: 13.5px/1.35 "Helvetica Neue", Arial, sans-serif;
  transform: translateX(-100%); transition: transform .18s ease; overscroll-behavior: contain;
}
body.nav-open .toc { transform: none; }
.toc .toc-title { font-weight: bold; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.toc .toc-tools { margin: 0 0 10px; display: flex; gap: 6px; }
.toc .toc-tools button { font: 11.5px "Helvetica Neue", Arial, sans-serif; background: transparent; color: var(--muted); border: 1px solid var(--pop-border); border-radius: 4px; padding: 2px 7px; cursor: pointer; }
.toc details { margin: 0; }
.toc summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 4px; }
.toc summary::-webkit-details-marker { display: none; }
.toc summary .tw { flex: none; width: 12px; color: var(--muted); font-size: 10px; transition: transform .12s; display: inline-block; }
.toc details[open] > summary .tw { transform: rotate(90deg); }
.toc .leaf .tw { visibility: hidden; }
.toc a { color: var(--ink); display: block; padding: 3px 4px; border-radius: 3px; flex: 1; }
.toc a:hover { background: color-mix(in srgb, var(--link) 10%, transparent); }
.toc a.active { color: var(--link); background: color-mix(in srgb, var(--link) 13%, transparent); font-weight: bold; }
.toc .lv-part { margin-top: 10px; }
.toc .lv-part > summary > a { font-weight: bold; color: var(--maroon); }
.toc .lv-part > summary > a.active { color: var(--maroon); }
.toc .kids { margin-left: 12px; border-left: 1px solid var(--pop-border); padding-left: 4px; }
.toc .lv-3 a { font-size: 12.5px; color: var(--muted); }
.toc .lv-3 a.active { color: var(--link); }
.toc .num { color: var(--muted); margin-right: 3px; font-weight: normal; }
.nav-toggle {
  position: fixed; top: 12px; left: 14px; z-index: 46; font: 12px "Helvetica Neue", Arial, sans-serif;
  background: var(--paper); color: var(--muted); border: 1px solid var(--pop-border); border-radius: 4px; padding: 3px 8px; cursor: pointer;
}
@media (min-width: 1400px) {
  body.nav-open .page { margin-left: calc(var(--navw) + max(0px, (100vw - var(--navw) - 1240px) / 2)); }
}
@media (max-width: 1399px) {
  body.nav-open::after { content: ""; position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 44; }
}
.theme-toggle {
  position: fixed; top: 12px; right: 14px; z-index: 40; font: 12px "Helvetica Neue", Arial, sans-serif;
  background: transparent; color: var(--muted); border: 1px solid var(--pop-border); border-radius: 4px; padding: 3px 8px; cursor: pointer;
}

%%LECTURE_CSS%%

@media (max-width: 1000px) {
  .page { padding: 28px 16px 80px; }
  header > *, section > *, .part > * { width: 100%; }
  figure.plot.narrow { width: 80%; }
  figure.plot.margin { float: none; width: 70%; margin: 1em auto; }
  .env::before { position: static; display: block; margin-bottom: .2em; font-size: .7em; }
  .env.rem::before, .env.ex::before { font-size: .85em; }
  .sn-ref { cursor: pointer; }
  .sidenote { display: none; }
  .sn-toggle:checked + .sidenote, .marginnote {
    display: block; float: none; width: auto; margin: .5em 0 .8em; padding-left: .8em;
    border-left: 2px solid var(--pop-border);
  }
  p { text-align: left; }
}
@media print {
  :root:root:root {  /* paper is white in both themes; this outranks the dark-theme blocks above */
    --paper: #ffffff; --ink: #161616; --muted: #555; --maroon: #800000;
    --cerulean: #1b9ad6; --cerulean-bg: #e8f5fc; --dandelion: #f2a83b; --dandelion-bg: #fef6ea;
    --navy: #3c64b4; --red: #d4302c; --black: #161616; --link: #1d4f91; --rule: #161616;
    --pop-bg: #ffffff; --pop-border: #c9c9c9; --code-bg: #f4f4f2; --lv-hl: rgba(255, 205, 50, .42);
  }
  .theme-toggle, .preview, .toc, .nav-toggle { display: none !important; }
  body.nav-open .page { margin-left: auto; }
  details.proof { display: block; }
}
</style>
</head>
<body>
<button class="theme-toggle" type="button" aria-label="Toggle light or dark theme">Theme</button>
<button class="nav-toggle" type="button" aria-label="Show or hide the outline" hidden>☰ Outline</button>
<nav class="toc" aria-label="Outline" hidden></nav>
<button class="lv-toggle" type="button" hidden>▶ Lecture</button>
<div class="foldbar"></div>
<main class="page">
%%BODY%%
</main>
<div class="lv-ctl" hidden><button type="button" data-a="restart" title="Restart the lecture">⏮</button><button type="button" data-a="back" title="Back (←)">◂</button><span class="lv-count"></span><button type="button" data-a="next" title="Next (Space, → or a click on the page)">▸</button><button type="button" data-a="end" title="Show the whole note">⏭</button></div>
<div class="preview" role="tooltip"></div>
<script>
const CITES = %%CITES%%;
function renderMath() {
  try {
    renderMathInElement(document.body, {
      delimiters: [{left: "\\[", right: "\\]", display: true}, {left: "\\(", right: "\\)", display: false}],
      ignoredClasses: ["katex"],  // math the build already drew
      throwOnError: false, trust: true, strict: "ignore"  // \htmlId marks pointer targets for the live mode
    });
  } finally { try { linkRefs(); } finally { try { buildNav(); } finally { lvBoot(); } } }
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", renderMath); else renderMath();

const pop = document.querySelector(".preview");
let current = null, hideTimer = null;
const hoverCapable = window.matchMedia("(hover: hover)").matches;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function show(a) {
  clearTimeout(hideTimer);
  if (current === a && pop.style.display === "block") return;
  if (a.classList.contains("xref")) return showRef(a);
  const d = CITES[a.dataset.k];
  if (!d) return;
  current = a;
  pop.replaceChildren();
  const head = el("div", "pv-head");
  if (d.loc) head.append(el("span", "pv-loc", d.loc));
  head.append(el("b", "", d.title), document.createTextNode(" · "), el("span", "pv-where", d.where));
  pop.append(head);
  if (d.img) {
    const body = el("div", "pv-body");
    const img = el("img");
    img.src = d.img; img.alt = d.title + ", " + d.where; img.width = d.w; img.height = d.h;
    body.append(img); pop.append(body);
  } else {
    pop.append(el("blockquote", "pv-text", "“" + d.text + "”"));
  }
  const foot = !d.href ? "Source not linked in this copy"
    : d.img && /\.pdf#page=/.test(d.href) ? "Click to open the PDF at this page ↗" : "Click to open the source ↗";
  pop.append(el("div", "pv-foot", foot));
  pop.style.display = "block";
  place(a);
}

function place(a) {
  const r = a.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = Math.min(Math.max(12, r.left + r.width / 2 - w / 2), window.innerWidth - w - 12);
  let top = r.bottom + 8;
  if (top + h > window.innerHeight - 12 && r.top - h - 8 > 12) top = r.top - h - 8;
  if (top + h > window.innerHeight - 12) top = Math.max(12, window.innerHeight - h - 12);
  pop.style.left = left + "px"; pop.style.top = top + "px";
}

function hideSoon() {
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { pop.style.display = "none"; current = null; }, 220);
}

document.querySelectorAll("a.cite").forEach(a => {
  a.addEventListener("mouseenter", () => show(a));
  a.addEventListener("mouseleave", hideSoon);
  a.addEventListener("focus", () => show(a));
  a.addEventListener("blur", hideSoon);
  a.addEventListener("click", e => {
    if (a.dataset.nolink) { e.preventDefault(); show(a); return; }
    if (!hoverCapable && current !== a) { e.preventDefault(); show(a); }
  });
});
pop.addEventListener("mouseenter", () => clearTimeout(hideTimer));
pop.addEventListener("mouseleave", hideSoon);
pop.addEventListener("click", e => {
  if (!current) return;
  if (current.classList.contains("xref")) {
    if (e.target.closest("summary, a")) return;  // let folds and links inside the preview work
    goTo(current.dataset.target); pop.style.display = "none"; current = null; return;
  }
  if (!current.dataset.nolink) window.open(current.href, "_blank", "noopener");
});
pop.style.cursor = "pointer";
window.addEventListener("scroll", () => { if (current && pop.style.display === "block") place(current); }, {passive: true});
document.addEventListener("keydown", e => { if (e.key === "Escape") { pop.style.display = "none"; current = null; } });
document.addEventListener("click", e => {
  if (!hoverCapable && current && !e.target.closest("a.cite, a.xref") && !e.target.closest(".preview")) { pop.style.display = "none"; current = null; }
});

/* Internal cross-references. After KaTeX renders, every numbered object gets an id and a key:
   env blocks by data-label ("Theorem 3.6", "Remark 3.9"), equations by their \tag ("(3.1)"),
   figures and tables by the number in their caption, sections by data-num ("Section 5.3" or "§5.3").
   Plain-text mentions of a key that exists in the note become links with a hover preview.
   Skipped: math, links, headings, captions' own labels, the outline, and anything inside .noref
   (wrap an external reference such as "Tong's (3.4)" in <span class="noref"> if it is not in a chip).
   An equation number right after a capitalized word or a possessive ("Tong (3.5)", "Tong's (3.4)")
   is treated as external and left alone ("Equation (9.2)" and "Eq. (9.2)" are linked); so is anything
   between curly quotes “…”, which is quoted source wording. */
const REFS = {};
function plainText(e) { const c = e.cloneNode(true); c.querySelectorAll(".katex-mathml").forEach(x => x.remove()); return c.textContent.trim(); }
function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
function addRef(key, node, title) {
  if (!node || REFS[key]) return;
  if (!node.id) node.id = "ref-" + slug(key);
  REFS[key] = {id: node.id, title: title || key};
}
function collectRefs() {
  document.querySelectorAll(".page .env[data-label]").forEach(b => {
    addRef(b.dataset.label.trim(), b);
  });
  document.querySelectorAll(".page .katex-display .tag").forEach(t => {
    const m = t.textContent.match(/\((\d+(?:\.\d+)*[a-z]?)\)/);
    if (m) addRef("(" + m[1] + ")", t.closest(".katex-display"), "Equation (" + m[1] + ")");
  });
  document.querySelectorAll(".page figure").forEach(f => {
    const m = (f.querySelector("figcaption .sc") || {}).textContent?.match(/Figure\s+(\d+(?:\.\d+)*)/);
    if (m) addRef("Figure " + m[1], f);
  });
  document.querySelectorAll(".page .tablewrap, .page table").forEach(w => {
    const m = (w.querySelector("caption .sc") || {}).textContent?.match(/Table\s+(\d+(?:\.\d+)*)/);
    if (m) addRef("Table " + m[1], w.classList.contains("tablewrap") ? w : (w.closest(".tablewrap") || w));
  });
  document.querySelectorAll(".page h2[data-num], .page h3[data-num]").forEach(h => {
    const n = h.dataset.num, title = "Section " + n + " · " + plainText(h);
    addRef("Section " + n, h, title); REFS["§" + n] = REFS["Section " + n];
  });
}
const REF_RE = /\b(Theorems?|Lemmas?|Definitions?|Corollar(?:y|ies)|Propositions?|Remarks?|Examples?|Figures?|Tables?|Sections?)\s+(\d+(?:\.\d+)*)|§\s?(\d+(?:\.\d+)*)|\((\d+\.\d+[a-z]?)\)/g;
function refKey(m) {
  if (m[3]) return "§" + m[3];
  if (m[4]) return "(" + m[4] + ")";
  let w = m[1].replace(/ies$/, "y").replace(/s$/, "");
  return w + " " + m[2];
}
function linkRefs() {
  collectRefs();
  if (!Object.keys(REFS).length) return;
  const skip = "a, .katex, .katex-display, h1, h2, h3, figcaption .sc, caption .sc, .toc, .noref, script, style, .preview, summary .sc";
  const walker = document.createTreeWalker(document.querySelector(".page"), NodeFilter.SHOW_TEXT, {
    acceptNode: n => (!n.nodeValue.trim() || n.parentElement.closest(skip)) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  let inQuote = false;  // text between curly quotes is source wording: its numbers refer to the source
  const quoteAt = (text, i) => { let q = inQuote; for (const ch of text.slice(0, i)) { if (ch === "“") q = true; else if (ch === "”") q = false; } return q; };
  nodes.forEach(node => {
    const text = node.nodeValue; let last = 0, out = null; REF_RE.lastIndex = 0; let m;
    const startQuote = inQuote;
    while ((m = REF_RE.exec(text))) {
      const key = refKey(m), ref = REFS[key];
      if (!ref) continue;
      inQuote = startQuote; if (quoteAt(text, m.index)) continue;
      const before = text.slice(Math.max(0, m.index - 20), m.index);
      if (m[4] && /(?:[A-Z][\w-]*|['’]s)\s*$/.test(before) && !/\b(?:Equations?|Eqs?\.)\s*$/.test(before)) continue;
      const own = node.parentElement.closest("[id]");
      if (own && own.id === ref.id) continue;  // a block mentioning itself
      out = out || document.createDocumentFragment();
      out.append(text.slice(last, m.index));
      const a = document.createElement("a");
      a.className = "xref"; a.href = "#" + ref.id; a.dataset.target = ref.id; a.dataset.ref = key;
      a.textContent = m[0];
      out.append(a); last = m.index + m[0].length;
    }
    inQuote = quoteAt(text, text.length);
    if (out) { out.append(text.slice(last)); node.replaceWith(out); }
  });
  document.querySelectorAll("a.xref").forEach(a => {
    a.addEventListener("mouseenter", () => show(a));
    a.addEventListener("mouseleave", hideSoon);
    a.addEventListener("focus", () => show(a));
    a.addEventListener("blur", hideSoon);
    a.addEventListener("click", e => {
      e.preventDefault();
      if (!hoverCapable && current !== a) { show(a); return; }
      pop.style.display = "none"; current = null; goTo(a.dataset.target);
    });
  });
}
function goTo(id) {
  const t = document.getElementById(id);
  if (!t) return;
  for (let d = t.closest("details"); d; d = d.parentElement.closest("details")) d.open = true;
  history.pushState(null, "", "#" + id);
  t.scrollIntoView({behavior: "smooth", block: "center"});
  t.classList.remove("xref-flash"); void t.offsetWidth; t.classList.add("xref-flash");
}
function showRef(a) {
  const ref = REFS[a.dataset.ref], t = document.getElementById(a.dataset.target);
  if (!ref || !t) return;
  current = a;
  pop.replaceChildren();
  const head = el("div", "pv-head");
  const inProof = t.closest("details.proof");
  if (inProof) head.append(el("span", "pv-loc", "inside a folded block"));
  head.append(el("b", "", ref.title));
  pop.append(head);
  const body = el("div", "pv-ref");
  let c;
  if (t.matches("h2, h3")) {  // a section: its heading and first paragraph
    c = document.createElement("div");
    c.append(t.cloneNode(true));
    let n = t.nextElementSibling;
    while (n && !n.matches("p")) n = n.nextElementSibling;
    if (n) c.append(n.cloneNode(true));
  } else if (t.matches(".katex-display")) {  // an equation: show the paragraph or block that holds it
    const holder = t.closest(".env") || t.closest("p") || t;
    c = holder.cloneNode(true);
  } else c = t.cloneNode(true);
  c.querySelectorAll("[id]").forEach(x => x.removeAttribute("id")); c.removeAttribute?.("id");
  c.querySelectorAll(".katex-mathml, .sidenote, .marginnote, .sn-ref, .sn-toggle, figure.margin").forEach(x => x.remove());
  c.classList?.remove("xref-flash");
  body.append(c); pop.append(body);
  pop.append(el("div", "pv-foot", "Click to go there"));
  pop.style.display = "block";
  place(a);
}


/* side navigation: parts > h2 sections > h3 subsections, foldable, with the current place highlighted.
   Built after KaTeX has rendered, so headings with math read as typeset text. */
function buildNav() {
  const heads = [...document.querySelectorAll(".page .part, .page section > h2:not(.unnumbered), .page section > h3")];
  if (heads.length < 4) return;
  const toc = document.querySelector(".toc"), btn = document.querySelector(".nav-toggle");
  toc.hidden = false; btn.hidden = false;
  const label = h => {
    if (h.classList.contains("part")) return ["Part " + h.dataset.part, (h.querySelector("h1") || h).textContent.trim()];
    const c = h.cloneNode(true);
    c.querySelectorAll(".katex-mathml, .sidenote, .marginnote, .sn-ref, .sn-toggle").forEach(x => x.remove());
    return [h.dataset.num || "", c.textContent.replace(/\s+/g, " ").trim()];
  };
  const linkFor = h => {
    const [n, t] = label(h), a = el("a");
    a.href = "#" + h.id;
    if (n) a.append(el("span", "num", n));
    a.append(document.createTextNode(t));
    a.addEventListener("click", e => {
      e.stopPropagation();
      if (!window.matchMedia("(min-width: 1400px)").matches) setOpen(false);
    });
    return a;
  };
  const node = (h, level) => {
    const d = el("details", "lv-" + level), s = el("summary"), tw = el("span", "tw", "▸");
    s.append(tw, linkFor(h)); d.append(s);
    tw.addEventListener("click", e => { e.preventDefault(); d.open = !d.open; });
    const kids = el("div", "kids"); d.append(kids);
    return {d, kids};
  };
  const tools = el("div", "toc-tools"), bOpen = el("button", "", "Expand all"), bClose = el("button", "", "Collapse all");
  tools.append(bOpen, bClose);
  toc.append(el("div", "toc-title", "Outline"), tools);
  let part = null, sec = null;
  const map = new Map();
  for (const h of heads) {
    if (h.classList.contains("part")) {
      const n = node(h, "part"); n.d.open = true; toc.append(n.d); part = n; sec = null; map.set(h, n.d);
    } else if (h.tagName === "H2") {
      const n = node(h, 2); (part ? part.kids : toc).append(n.d); sec = n; map.set(h, n.d);
    } else {
      const n = node(h, 3); n.d.classList.add("leaf"); (sec ? sec.kids : part ? part.kids : toc).append(n.d); map.set(h, n.d);
    }
  }
  toc.querySelectorAll("details").forEach(d => { if (!d.querySelector(".kids details")) d.classList.add("leaf"); });
  bOpen.addEventListener("click", () => toc.querySelectorAll("details").forEach(d => d.open = true));
  bClose.addEventListener("click", () => toc.querySelectorAll("details").forEach(d => d.open = false));
  function setOpen(v) {
    document.body.classList.toggle("nav-open", v);
    try { localStorage.setItem("san-nav", v ? "1" : "0"); } catch (e) {}
  }
  let saved = null;
  try { saved = localStorage.getItem("san-nav"); } catch (e) {}
  setOpen(saved ? saved === "1" : window.matchMedia("(min-width: 1400px)").matches);
  btn.addEventListener("click", () => setOpen(!document.body.classList.contains("nav-open")));
  document.addEventListener("click", e => {
    if (document.body.classList.contains("nav-open") && !window.matchMedia("(min-width: 1400px)").matches
        && !e.target.closest(".toc") && !e.target.closest(".nav-toggle")) setOpen(false);
  });
  let active = null;
  function spy() {
    const y = 90;
    let cur = heads[0];
    for (const h of heads) { if (h.getBoundingClientRect().top <= y) cur = h; else break; }
    if (cur === active) return;
    active = cur;
    toc.querySelectorAll("a.active").forEach(a => a.classList.remove("active"));
    const d = map.get(cur); if (!d) return;
    const a = d.querySelector(":scope > summary > a"); a.classList.add("active");
    for (let p = d; p && p !== toc; p = p.parentElement) if (p.tagName === "DETAILS") p.open = true;
    const r = a.getBoundingClientRect(), t = toc.getBoundingClientRect();
    if (r.top < t.top + 40 || r.bottom > t.bottom - 20) toc.scrollTop += (r.top - t.top) - toc.clientHeight / 2;
  }
  let ticking = false;
  window.addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; spy(); }); } }, {passive: true});
  spy();
}

%%LECTURE_JS%%
const root = document.documentElement;
try { const t = localStorage.getItem("san-theme"); if (t) root.dataset.theme = t; } catch (e) {}
document.querySelector(".theme-toggle").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark"
    : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("san-theme", root.dataset.theme); } catch (e) {}
});
</script>
