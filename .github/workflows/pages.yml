name: Build demo and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"   # draws the math at build time
      - name: Install engine dependencies
        run: pip install -r skills/unfold/requirements.txt
      - name: Build the demo note from scratch
        run: python skills/unfold/scripts/build.py examples/quantum-geometry
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp examples/quantum-geometry/quantum-geometry.html _site/index.html
          cp examples/quantum-geometry/Peotta_Torma_2015_NatCommun.pdf _site/
          cp examples/quantum-geometry/LICENSE.md _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
